name: CI

on:
  push:
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements_dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_dev.txt

      - name: Run Ruff
        run: python -m ruff check app tests

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements_dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_dev.txt

      - name: Run Pyright
        run: python -m pyright

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mental_health_app_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mental_health_app_test
      SECRET_KEY: ci-test-secret-key
      OPENAI_API_KEY: ci-test-openai-key
      OPENAI_MODEL: gpt-5-mini
      SCHEDULER_ENABLED: "false"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mental_health_app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mental_health_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements_dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_dev.txt

      - name: Run backend tests
        run: python -m pytest

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-quality
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mental_health_app_e2e
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mental_health_app_e2e
      SECRET_KEY: ci-e2e-secret-key
      OPENAI_API_KEY: ci-test-openai-key
      OPENAI_MODEL: gpt-5-mini
      SCHEDULER_ENABLED: "false"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
      SEED_ADMIN_EMAIL: admin.test@mentalhealthapp.com
      SEED_ADMIN_PASSWORD: AdminTest123!
      SEED_SPECIALIST_EMAIL: specialist.test@mentalhealthapp.com
      SEED_SPECIALIST_PASSWORD: SpecialistTest123!
      SEED_USER_EMAIL: user.test@mentalhealthapp.com
      SEED_USER_PASSWORD: UserTest123!

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mental_health_app_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mental_health_app_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements_dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Seed deterministic demo data
        working-directory: backend
        run: python -m app.scripts.seed_demo_data

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend-e2e.log 2>&1 &

      - name: Wait for backend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become healthy" >&2
          exit 1

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            backend-e2e.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
